<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>カラーパレット</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #ddd;padding:12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;font-weight:700}
button{font:inherit}
.clear{border:1px solid #ccc;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.status{margin-top:6px;color:#666;font-size:13px}
.preview{display:flex;width:100%;height:180px;margin-top:10px;gap:2px;border-radius:10px;overflow:hidden;background:#eee;
  /* Safari(iOS)のsticky+backdrop-filter配下で再描画が走らないバグ対策：独立した描画レイヤーに乗せる */
  transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;}
.preview.empty{display:grid;grid-template-columns:repeat(5,1fr);height:54px;gap:4px;background:transparent}
.preview.empty .slot{background:#eee;border:1px dashed #bbb;border-radius:7px}
.slot{position:relative;min-width:0;flex:1;height:100%;border:1px solid #ddd}
.slot .num{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.85);border-radius:5px;padding:2px 5px;font-size:11px;font-weight:700}
.slot .code{position:absolute;left:4px;right:4px;bottom:6px;text-align:center;background:rgba(255,255,255,.9);border-radius:5px;padding:4px 2px;font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{padding:12px 14px 4px}
.categories{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{border:1px solid #d3d3d3;background:#fff;border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:13px}
.cat.active{background:#222;color:#fff;border-color:#222}
.grid{padding:8px 14px 30px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.item{min-width:0}
.swatch{width:100%;aspect-ratio:1;border-radius:11px;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;position:relative}
.swatch.selected{border-color:#111;box-shadow:0 0 0 3px #fff,0 0 0 5px #111}
.badge{position:absolute;right:5px;top:5px;min-width:21px;height:21px;padding:0 5px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.name{font-size:9px;color:#555;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
@media(min-width:700px){.grid{grid-template-columns:repeat(10,1fr)}.preview{height:220px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🎨 カラーパレット</h1>
    <button class="clear" id="clear">全解除</button>
  </div>
  <div class="status" id="status">選択中：0 / 10色</div>
  <div class="preview empty" id="preview"></div>
</header>

<section class="filters">
  <div class="categories" id="categories"></div>
</section>
<main class="grid" id="grid"></main>

<script>
const palettes={
"赤":["#450A0A","#7F1D1D","#991B1B","#B91C1C","#DC2626","#EF4444","#F87171","#FCA5A5","#FECACA","#FEE2E2","#FEF2F2","#CD5C5C"],
"橙":["#431407","#7C2D12","#9A3412","#C2410C","#EA580C","#F97316","#FB923C","#FDBA74","#FED7AA","#FFEDD5","#FFF7ED","#E9967A"],
"黄":["#422006","#713F12","#854D0E","#A16207","#CA8A04","#EAB308","#FACC15","#FDE047","#FEF08A","#FEF9C3","#FEFCE8","#BDB76B"],
"黄緑":["#1A2E05","#365314","#3F6212","#4D7C0F","#65A30D","#84CC16","#A3E635","#BEF264","#D9F99D","#ECFCCB","#F7FEE7","#6B8E23"],
"緑":["#052E16","#14532D","#166534","#15803D","#16A34A","#22C55E","#4ADE80","#86EFAC","#BBF7D0","#DCFCE7","#F0FDF4","#8FBC8F","#556B2F"],
"青緑":["#042F2E","#134E4A","#115E59","#0F766E","#0D9488","#14B8A6","#2DD4BF","#5EEAD4","#99F6E4","#CCFBF1","#F0FDFA","#5F9EA0"],
"水色":["#082F49","#0C4A6E","#075985","#0369A1","#0284C7","#0EA5E9","#38BDF8","#7DD3FC","#BAE6FD","#E0F2FE","#F0F9FF","#B0E0E6","#B0C4DE"],
"青":["#172554","#1E3A8A","#1E40AF","#1D4ED8","#2563EB","#3B82F6","#60A5FA","#93C5FD","#BFDBFE","#DBEAFE","#EFF6FF","#4682B4"],
"紫":["#2E1065","#4C1D95","#5B21B6","#6D28D9","#7C3AED","#8B5CF6","#A78BFA","#C4B5FD","#DDD6FE","#EDE9FE","#F5F3FF","#D8BFD8"],
"ピンク":["#500724","#831843","#9D174D","#BE185D","#DB2777","#EC4899","#F472B6","#F9A8D4","#FBCFE8","#FCE7F3","#FDF2F8","#BC8F8F"],
"茶":["#451A03","#78350F","#92400E","#B45309","#D97706","#F59E0B","#FBBF24","#A0522D","#CD853F"],
"ベージュ":["#78716C","#A8A29E","#D6D3D1","#E7E5E4","#F5F5F4","#FAFAF9","#D2B48C","#F5DEB3"],
"グレー":["#111827","#1F2937","#374151","#4B5563","#6B7280","#9CA3AF","#D1D5DB","#E5E7EB","#F3F4F6","#F9FAFB","#708090"],
"黒":["#000000","#020617","#030712","#09090B","#0A0A0A","#0C0A09"],
"白":["#FFFFFF","#F8FAFC","#F9FAFB","#FAFAFA","#FAFAF9"]
};

const all=[];
for(const [category,arr] of Object.entries(palettes)){
  arr.forEach((hex,index)=>all.push({hex,category,index}));
}
const categoryOrder=Object.keys(palettes);
function hue(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  if(!d)return 0;
  let h;
  if(max===r)h=((g-b)/d)%6;
  else if(max===g)h=(b-r)/d+2;
  else h=(r-g)/d+4;
  h*=60; return h<0?h+360:h;
}
all.sort((a,b)=>hue(a.hex)-hue(b.hex));

let selected=[];
let current="すべて";

const categoriesEl=document.getElementById("categories");
const gridEl=document.getElementById("grid");
const previewEl=document.getElementById("preview");
const statusEl=document.getElementById("status");

function renderCategories(){
  categoriesEl.innerHTML="";
  ["すべて",...categoryOrder].forEach(category=>{
    const button=document.createElement("button");
    button.className="cat"+(current===category?" active":"");
    button.textContent=category;
    button.addEventListener("click",()=>{
      current=category;
      renderCategories();
      renderGrid();
    });
    categoriesEl.appendChild(button);
  });
}

function renderGrid(){
  gridEl.innerHTML="";
  const list=current==="すべて"?all:all.filter(c=>c.category===current);
  list.forEach(color=>{
    const item=document.createElement("div");
    item.className="item";
    const swatch=document.createElement("div");
    swatch.className="swatch";
    swatch.style.backgroundColor=color.hex;
    const selectedIndex=selected.indexOf(color.hex);
    if(selectedIndex!==-1){
      swatch.classList.add("selected");
      const badge=document.createElement("span");
      badge.className="badge";
      badge.textContent=selectedIndex+1;
      swatch.appendChild(badge);
    }
    swatch.addEventListener("click",()=>toggleColor(color.hex));
    item.appendChild(swatch);
    const name=document.createElement("div");
    name.className="name";
    name.textContent=color.category+" "+(color.index+1);
    item.appendChild(name);
    gridEl.appendChild(item);
  });
}

function toggleColor(hex){
  const index=selected.indexOf(hex);
  if(index!==-1){
    selected.splice(index,1);
  }else{
    if(selected.length>=10){
      alert("選択できるのは最大10色です。");
      return;
    }
    selected.push(hex);
  }
  renderPreview();
  renderGrid();
}

function renderPreview(){
  statusEl.textContent=`選択中：${selected.length} / 10色`;
  previewEl.innerHTML="";
  if(selected.length===0){
    previewEl.className="preview empty";
    for(let i=0;i<5;i++){
      const slot=document.createElement("div");
      slot.className="slot";
      previewEl.appendChild(slot);
    }
    forceRepaint();
    return;
  }
  previewEl.className="preview";
  selected.forEach((hex,index)=>{
    const slot=document.createElement("div");
    slot.className="slot";
    slot.style.backgroundColor=hex;
    const num=document.createElement("span");
    num.className="num";
    num.textContent=index+1;
    slot.appendChild(num);
    const code=document.createElement("span");
    code.className="code";
    code.textContent=hex.toUpperCase();
    slot.appendChild(code);
    previewEl.appendChild(slot);
  });
  forceRepaint();
}

// iOS Safariで position:sticky + backdrop-filter の内側にあるDOM更新が
// 画面に反映されない(再描画されない)ことがあるバグへの保険。
// 強制的にレイアウトを読ませて再描画をトリガーする。
function forceRepaint(){
  void previewEl.offsetHeight;
}

document.getElementById("clear").addEventListener("click",()=>{
  selected=[];
  renderPreview();
  renderGrid();
});

renderCategories();
renderPreview();
renderGrid();
</script>
</body>
</html>
