<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>カラーパレット</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #ddd;padding:12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;font-weight:700}
button{font:inherit}
.clear{border:1px solid #ccc;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.status{margin-top:6px;color:#666;font-size:13px}
.preview{display:flex;width:100%;height:180px;margin-top:10px;gap:2px;border-radius:10px;overflow:hidden;background:#eee}
.preview.empty{display:grid;grid-template-columns:repeat(5,1fr);height:54px;gap:4px;background:transparent}
.preview.empty .slot{background:#eee;border:1px dashed #bbb;border-radius:7px}
.slot{position:relative;min-width:0;flex:1;border:1px solid #ddd}
.slot .num{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.82);border-radius:5px;padding:2px 5px;font-size:11px}
.slot .code{position:absolute;left:5px;right:5px;bottom:6px;text-align:center;background:rgba(255,255,255,.86);border-radius:5px;padding:4px 2px;font-size:11px}
.filters{padding:12px 14px 4px}
.categories{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{border:1px solid #d3d3d3;background:#fff;border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:13px}
.cat.active{background:#222;color:#fff;border-color:#222}
.grid{padding:8px 14px 30px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.item{min-width:0}
.swatch{width:100%;aspect-ratio:1;border-radius:11px;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;position:relative}
.swatch.selected{border-color:#111;box-shadow:0 0 0 3px #fff,0 0 0 5px #111}
.badge{position:absolute;right:5px;top:5px;min-width:21px;height:21px;padding:0 5px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.name{font-size:9px;color:#555;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
@media(min-width:700px){.grid{grid-template-columns:repeat(10,1fr)}.preview{height:220px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🎨 カラーパレット</h1>
    <button class="clear" id="clear">全解除</button>
  </div>
  <div class="status" id="status">選択中：0 / 10色</div>
  <div class="preview empty" id="preview"></div>
</header>

<section class="filters">
  <div class="categories" id="categories"></div>
</section>
<main class="grid" id="grid"></main>

<script>
const palettes={
"赤":["#5C0011","#7A0019","#99001B","#B00020","#C62828","#D32F2F","#E53935","#EF5350","#F44336","#FF5252","#FF6B6B","#FF8A80","#FFCDD2","#FFEBEE"],
"橙":["#7F2704","#9A3412","#C2410C","#D65A00","#E65100","#EF6C00","#F57C00","#FB8C00","#FF9800","#FFB74D","#FFCC80","#FFE0B2","#FFF3E0"],
"黄":["#665C00","#827717","#9E9D24","#AFB42B","#C0CA33","#CDDC39","#D4E157","#E6EE9C","#F0F4C3","#F9A825","#FBC02D","#FDD835","#FFEB3B","#FFF59D","#FFF9C4"],
"黄緑":["#365314","#3F6212","#4D7C0F","#65A30D","#84CC16","#8BC34A","#9CCC65","#AED581","#C5E1A5","#D9F99D","#ECFCCB"],
"緑":["#064E3B","#065F46","#047857","#059669","#10B981","#16A34A","#22C55E","#43A047","#4CAF50","#66BB6A","#81C784","#A5D6A7","#C8E6C9","#E8F5E9"],
"青緑":["#042F2E","#115E59","#0F766E","#0D9488","#14B8A6","#26A69A","#4DB6AC","#80CBC4","#B2DFDB","#CCFBF1"],
"水色":["#0C4A6E","#075985","#0369A1","#0284C7","#0EA5E9","#03A9F4","#29B6F6","#4FC3F7","#81D4FA","#B3E5FC","#E0F7FA"],
"青":["#172554","#1E3A8A","#1D4ED8","#2563EB","#3B82F6","#1976D2","#2196F3","#42A5F5","#64B5F6","#90CAF9","#BFDBFE","#DBEAFE","#EFF6FF"],
"紫":["#2E1065","#4C1D95","#5B21B6","#6D28D9","#7C3AED","#8B5CF6","#9C27B0","#AB47BC","#BA68C8","#CE93D8","#D8B4FE","#EDE9FE"],
"ピンク":["#831843","#9D174D","#BE185D","#DB2777","#E11D48","#EC407A","#F06292","#F48FB1","#F8BBD0","#FCE4EC","#FF80AB","#FFB6C1","#FFE4E6"],
"茶":["#3E2723","#4E342E","#5D4037","#6D4C41","#795548","#8D6E63","#A1887F","#BCAAA4","#D7CCC8","#EFEBE9","#78350F","#92400E","#B45309","#D97706","#F59E0B"],
"ベージュ":["#5F4B32","#7A6548","#927B5A","#A89070","#B8A17A","#C8B28A","#D6C3A5","#E0C9A6","#E8D8BF","#F1E4CE","#F5E6CC","#FAF3E8"],
"グレー":["#111827","#1F2937","#374151","#4B5563","#6B7280","#9CA3AF","#A3A3A3","#BDBDBD","#D1D5DB","#D6D6D6","#E5E7EB","#EEEEEE","#F3F4F6","#F9FAFB"],
"黒":["#000000","#0A0A0A","#111111","#171717","#1C1C1C","#222222","#292929","#303030","#3A3A3A"],
"白":["#FFFFFF","#FFFEFA","#FFFDF5","#FFFDF0","#FFF9E6","#F8FAFC","#F5F5F5","#FAFAFA"]
};

const all=[];
for(const [category,arr] of Object.entries(palettes)){
  arr.forEach((hex,index)=>all.push({hex,category,index}));
}
const categoryOrder=Object.keys(palettes);
function hue(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  if(!d)return 0;
  let h;
  if(max===r)h=((g-b)/d)%6;
  else if(max===g)h=(b-r)/d+2;
  else h=(r-g)/d+4;
  h*=60; return h<0?h+360:h;
}
all.sort((a,b)=>hue(a.hex)-hue(b.hex));

let selected=[];
let current="すべて";

const categoriesEl=document.getElementById("categories");
const gridEl=document.getElementById("grid");
const previewEl=document.getElementById("preview");
const statusEl=document.getElementById("status");

function renderCategories(){
  categoriesEl.innerHTML="";
  ["すべて",...categoryOrder].forEach(category=>{
    const button=document.createElement("button");
    button.className="cat"+(current===category?" active":"");
    button.textContent=category;
    button.addEventListener("click",()=>{
      current=category;
      renderCategories();
      renderGrid();
    });
    categoriesEl.appendChild(button);
  });
}

function renderGrid(){
  gridEl.innerHTML="";
  const list=current==="すべて"?all:all.filter(c=>c.category===current);
  list.forEach(color=>{
    const item=document.createElement("div");
    item.className="item";
    const swatch=document.createElement("div");
    swatch.className="swatch";
    swatch.style.backgroundColor=color.hex;
    const selectedIndex=selected.indexOf(color.hex);
    if(selectedIndex!==-1){
      swatch.classList.add("selected");
      const badge=document.createElement("span");
      badge.className="badge";
      badge.textContent=selectedIndex+1;
      swatch.appendChild(badge);
    }
    swatch.addEventListener("click",()=>toggleColor(color.hex));
    item.appendChild(swatch);
    const name=document.createElement("div");
    name.className="name";
    name.textContent=color.category+" "+(color.index+1);
    item.appendChild(name);
    gridEl.appendChild(item);
  });
}

function toggleColor(hex){
  const index=selected.indexOf(hex);
  if(index!==-1){
    selected.splice(index,1);
  }else{
    if(selected.length>=10){
      alert("選択できるのは最大10色です。");
      return;
    }
    selected.push(hex);
  }
  renderPreview();
  renderGrid();
}

function renderPreview(){
  statusEl.textContent=`選択中：${selected.length} / 10色`;
  previewEl.innerHTML="";
  if(selected.length===0){
    previewEl.className="preview empty";
    for(let i=0;i<5;i++){
      const slot=document.createElement("div");
      slot.className="slot";
      previewEl.appendChild(slot);
    }
    return;
  }
  previewEl.className="preview";
  selected.forEach((hex,index)=>{
    const slot=document.createElement("div");
    slot.className="slot";
    slot.style.backgroundColor=hex;
    const num=document.createElement("span");
    num.className="num";
    num.textContent=index+1;
    slot.appendChild(num);
    const code=document.createElement("span");
    code.className="code";
    code.textContent=hex;
    slot.appendChild(code);
    previewEl.appendChild(slot);
  });
}

document.getElementById("clear").addEventListener("click",()=>{
  selected=[];
  renderPreview();
  renderGrid();
});

renderCategories();
renderPreview();
renderGrid();
</script>
</body>
</html>
